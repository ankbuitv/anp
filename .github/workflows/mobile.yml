name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mobile-app/**"
      - "global.json"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build unsigned Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Show tool versions
        run: |
          dotnet --version
          dotnet --info
          java -version

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # The project also targets iOS and MacCatalyst. Ubuntu cannot restore
      # those workloads, so explicitly limit this job to the Android target.
      - name: Restore Android project
        run: >-
          dotnet restore mobile-app/AnpMobile.csproj
          -p:TargetFrameworks=net9.0-android

      - name: Publish unsigned APK
        run: >-
          dotnet publish mobile-app/AnpMobile.csproj
          --configuration Release
          --framework net9.0-android
          --no-restore
          -p:TargetFrameworks=net9.0-android
          -p:AndroidPackageFormat=apk
          -p:AndroidKeyStore=false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anp-android-apk
          path: mobile-app/bin/Release/net9.0-android/**/*.apk
          if-no-files-found: error
          retention-days: 14